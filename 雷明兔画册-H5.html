<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<title>雷明兔 · 产品画册</title>
<style>
/* 雷明兔产品画册 H5 —— 与小程序同源样式
   尺寸换算：小程序 750rpx = 屏宽，这里 html font-size = 100vw/7.5，
   即 1rem = 100rpx，所有 rpx 值 ÷ 100 写成 rem，两端视觉 1:1 */
html {
    font-size: calc(100vw / 7.5);
}

body {
    margin: 0;
    background: #08090b;
    -webkit-tap-highlight-color: transparent;
}

* {
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
}

img {
    display: block;
}

:root {
    --bg: #08090b;
    --bg-deep: #050610;
    --panel: #0e1116;
    --panel-2: #0c0f13;
    --card: #12151b;
    --line: rgba(255, 255, 255, 0.07);
    --line-strong: rgba(255, 255, 255, 0.12);
    --txt: #f5f7fa;
    --txt-2: #a7afbc;
    --txt-3: #7d8694;
    --txt-4: #5c6472;
    --accent: #ff7a1a;
    --accent-soft: #ff9a4d;
    --accent-dim: rgba(255, 122, 26, 0.1);
}

.page {
    min-height: 100vh;
    background: var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
}

/* ---------- 自定义导航 ---------- */
.nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 90;
    padding-top: env(safe-area-inset-top);
    background: rgba(8, 9, 11, 0.92);
    backdrop-filter: blur(10px);
}

.nav-inner {
    display: flex;
    align-items: center;
    padding: 0 0.32rem;
    height: 0.88rem;
}

.nav-back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 0.56rem;
    height: 0.56rem;
    margin-left: -0.12rem;
    cursor: pointer;
}

.nav-back-icon {
    width: 0.2rem;
    height: 0.2rem;
    border-left: 0.03rem solid var(--txt);
    border-bottom: 0.03rem solid var(--txt);
    transform: rotate(45deg);
}

.nav-title {
    flex: 1;
    font-size: 0.3rem;
    font-weight: 600;
    letter-spacing: 0.005rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.nav-sub {
    margin-left: 0.12rem;
    color: var(--txt-3);
    font-size: 0.22rem;
    font-weight: 400;
}

.nav-actions {
    display: flex;
    align-items: center;
}

/* ---------- 底部 TabBar ---------- */
.tabbar {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 95;
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    background: #0a0c11;
}

.tabbar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 1rem;
    color: #7d8694;
    font-size: 0.2rem;
    cursor: pointer;
}

.tabbar-item img {
    width: 0.44rem;
    height: 0.44rem;
    margin-bottom: 0.02rem;
}

.tabbar-item.on {
    color: #ff7a1a;
}

.tab-page-body {
    padding-bottom: 1rem;
}

/* ---------- 通用元件 ---------- */
.chip {
    display: inline-flex;
    align-items: center;
    height: 0.52rem;
    padding: 0 0.2rem;
    border-radius: 0.12rem;
    background: var(--card);
    color: var(--txt-2);
    font-size: 0.22rem;
    cursor: pointer;
}

.dot {
    width: 0.18rem;
    height: 0.18rem;
    margin-right: 0.1rem;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
}

.arrow {
    width: 0.14rem;
    height: 0.14rem;
    border-top: 2px solid currentColor;
    border-right: 2px solid currentColor;
    transform: rotate(45deg);
}

.empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.8rem 0.48rem;
    text-align: center;
}

.empty-title {
    color: var(--txt-2);
    font-size: 0.26rem;
}

.empty-text {
    margin-top: 0.12rem;
    color: var(--txt-4);
    font-size: 0.22rem;
    line-height: 1.7;
}

/* ---------- 画册首页（deck） ---------- */
.deck {
    position: relative;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.deck-nav {
    position: relative;
    flex: none;
    z-index: 10;
    padding-top: env(safe-area-inset-top);
    background: rgba(8, 9, 11, 0.92);
    backdrop-filter: blur(10px);
}

.brand {
    display: flex;
    flex: 1;
    flex-direction: column;
    justify-content: center;
}

.brand-en {
    color: var(--accent);
    font-size: 0.18rem;
    font-weight: 600;
    letter-spacing: 0.05rem;
}

.brand-cn {
    margin-top: 0.04rem;
    color: var(--txt-2);
    font-size: 0.26rem;
    font-weight: 600;
}

.nav-count {
    display: flex;
    align-items: center;
    color: var(--txt-3);
    font-size: 0.2rem;
    cursor: pointer;
}

.ico-search {
    position: relative;
    width: 0.24rem;
    height: 0.24rem;
    margin-left: 0.16rem;
    border: 1px solid var(--txt-3);
    border-radius: 50%;
}

.ico-search-line {
    position: absolute;
    right: -0.08rem;
    bottom: -0.06rem;
    width: 0.12rem;
    height: 1px;
    background: var(--txt-3);
    transform: rotate(45deg);
}

.deck-swiper {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
}

.deck-swiper::-webkit-scrollbar {
    display: none;
}

.deck-slide {
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overscroll-behavior: contain;
}

.card {
    display: flex;
    height: 100%;
    flex-direction: column;
    padding-bottom: 1rem;
    background: var(--bg);
}

.stage {
    position: relative;
    flex: none;
    height: 6rem;
    background: #ffffff;
    cursor: pointer;
    overflow: hidden;
}

.stage-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.stage-tag {
    position: absolute;
    bottom: 0.22rem;
    left: 0.32rem;
    padding: 0.06rem 0.14rem;
    border-radius: 999px;
    background: rgba(14, 20, 30, 0.06);
    color: #4b5563;
    font-size: 0.18rem;
}

.stage-cta {
    position: absolute;
    right: 0.32rem;
    bottom: 0.22rem;
    color: #8b93a0;
    font-size: 0.18rem;
    cursor: pointer;
}

.stage-cta-shop {
    padding: 0.08rem 0.2rem;
    border-radius: 999px;
    background: rgba(255, 122, 26, 0.12);
    border: 1px solid rgba(255, 122, 26, 0.38);
    color: #c2521a;
    font-size: 0.19rem;
    font-weight: 600;
}

.body {
    display: flex;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    overflow-y: auto;
    padding: 0 0.32rem 0.14rem;
    scrollbar-width: none;
}

.body::-webkit-scrollbar {
    display: none;
}

.head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding-top: 0.16rem;
}

.head-l {
    flex: 1;
    min-width: 0;
}

.head-row {
    display: flex;
    align-items: center;
}

.model {
    font-size: 0.4rem;
    font-weight: 700;
    letter-spacing: 0.005rem;
}

.badge-new {
    margin-left: 0.14rem;
    padding: 0.03rem 0.1rem;
    border-radius: 0.06rem;
    background: var(--accent-dim);
    color: var(--accent-soft);
    font-size: 0.17rem;
    font-weight: 600;
    letter-spacing: 0.01rem;
}

.sub {
    display: block;
    margin-top: 0.08rem;
    overflow: hidden;
    color: var(--txt-3);
    font-size: 0.2rem;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.head-r {
    flex: none;
    padding-left: 0.2rem;
    text-align: right;
}

.price {
    color: var(--accent-soft);
    font-size: 0.32rem;
    font-weight: 600;
}

.price-note {
    display: block;
    margin-top: 0.02rem;
    color: var(--txt-4);
    font-size: 0.16rem;
}

.opts {
    margin-top: 0.18rem;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
}

.opts::-webkit-scrollbar {
    display: none;
}

.opts-inner {
    display: inline-flex;
    align-items: center;
}

.opt {
    display: inline-flex;
    align-items: center;
    height: 0.54rem;
    margin-right: 0.12rem;
    padding: 0 0.18rem;
    border: 1px solid transparent;
    border-radius: 0.12rem;
    background: var(--card);
    color: var(--txt-2);
    font-size: 0.2rem;
    cursor: pointer;
    flex: none;
}

.opt-on {
    border-color: rgba(255, 122, 26, 0.55);
    background: rgba(255, 122, 26, 0.1);
    color: #ffffff;
}

.grid {
    display: flex;
    margin-top: 0.18rem;
}

.cell {
    flex: 1;
    margin-right: 0.1rem;
    padding: 0.16rem 0.04rem 0.14rem;
    border-radius: 0.16rem;
    background: var(--panel-2);
    text-align: center;
}

.cell:last-child {
    margin-right: 0;
}

.cell-v {
    display: flex;
    align-items: baseline;
    justify-content: center;
}

.cell-num {
    font-size: 0.3rem;
    font-weight: 600;
    letter-spacing: 0.005rem;
}

.cell-unit {
    margin-left: 0.04rem;
    color: var(--txt-3);
    font-size: 0.16rem;
}

.cell-label {
    display: block;
    margin-top: 0.06rem;
    color: var(--txt-4);
    font-size: 0.16rem;
}

.entry {
    display: flex;
    align-items: center;
    height: 0.82rem;
    margin-top: 0.16rem;
    padding: 0 0.22rem;
    border: 1px solid rgba(255, 122, 26, 0.18);
    border-radius: 0.18rem;
    background: var(--accent-dim);
    cursor: pointer;
    flex: none;
}

.entry-ico {
    flex: none;
    width: 0.24rem;
    height: 0.24rem;
    margin-right: 0.14rem;
    border-radius: 50%;
    background: radial-gradient(circle, #ffd9b0 0%, #ff7a1a 52%, rgba(255, 122, 26, 0) 74%);
}

.entry-t {
    flex: 1;
    color: #ffffff;
    font-size: 0.23rem;
}

.entry .arrow {
    color: var(--accent-soft);
}

.spec-head {
    display: flex;
    align-items: baseline;
    margin-top: 0.18rem;
}

.spec-title {
    font-size: 0.22rem;
    font-weight: 600;
}

.spec-note {
    margin-left: 0.1rem;
    color: var(--txt-4);
    font-size: 0.15rem;
    letter-spacing: 0.006rem;
}

.spec-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 0.44rem;
    border-bottom: 1px solid var(--line);
}

.spec-k {
    flex: none;
    color: var(--txt-3);
    font-size: 0.2rem;
}

.spec-v {
    max-width: 64%;
    overflow: hidden;
    color: #e8ebf0;
    font-size: 0.2rem;
    text-align: right;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.more {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 0.54rem;
    margin-top: 0.04rem;
    color: var(--accent-soft);
    cursor: pointer;
}

.more-t {
    margin-right: 0.08rem;
    font-size: 0.19rem;
}

.hint {
    margin-top: auto;
    padding-top: 0.06rem;
    color: #565e6b;
    font-size: 0.18rem;
    text-align: center;
}

.hint::after {
    content: '';
    display: block;
    width: 0.09rem;
    height: 0.09rem;
    margin: 0.07rem auto 0;
    border-top: 1px solid currentColor;
    border-left: 1px solid currentColor;
    transform: rotate(45deg);
    opacity: 0.9;
}

@media (max-height: 700px) {
    .stage {
        height: 3.6rem;
    }

    .hint {
        display: none;
    }
}

/* ---------- 产品库 ---------- */
.lib-body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding-top: 0.08rem;
}

.search {
    display: flex;
    flex: none;
    align-items: center;
    height: 0.8rem;
    padding: 0 0.24rem;
    border-radius: 0.4rem;
    background: #12151b;
}

.search .ico-search {
    margin-left: 0;
    margin-right: 0.16rem;
}

.search-input {
    flex: 1;
    height: 0.8rem;
    border: none;
    outline: none;
    background: transparent;
    color: var(--txt);
    font-size: 0.24rem;
}

.search-input::placeholder {
    color: #6c7481;
}

.search-clear {
    padding: 0 0.06rem;
    color: var(--txt-3);
    font-size: 0.24rem;
    cursor: pointer;
}

.cats {
    flex: none;
    margin-top: 0.22rem;
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    white-space: nowrap;
}

.cats::-webkit-scrollbar {
    display: none;
}

.cat {
    flex: none;
    height: 0.52rem;
    margin-right: 0.14rem;
    padding: 0 0.22rem;
    border-radius: 0.1rem;
    background: var(--card);
    color: var(--txt-2);
    font-size: 0.21rem;
    line-height: 0.52rem;
    cursor: pointer;
}

.cat-on {
    background: var(--accent);
    color: #180a02;
    font-weight: 600;
}

.meta-row {
    display: flex;
    flex: none;
    align-items: center;
    justify-content: space-between;
    padding: 0.22rem 0 0.16rem;
}

.meta-count {
    color: var(--txt-3);
    font-size: 0.2rem;
}

.meta-sort {
    color: var(--accent-soft);
    font-size: 0.2rem;
}

.lib-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: 1.3rem;
}

.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
}

.pcard {
    width: 3.31rem;
    margin-bottom: 0.18rem;
    overflow: hidden;
    border-radius: 0.2rem;
    background: #0e1116;
    cursor: pointer;
}

.pimg-wrap {
    position: relative;
    height: 2.5rem;
    background: #ffffff;
}

.pimg {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.ptag {
    position: absolute;
    top: 0.14rem;
    left: 0.14rem;
    padding: 0.03rem 0.1rem;
    border-radius: 0.06rem;
    background: #ff7a1a;
    color: #ffffff;
    font-size: 0.16rem;
    font-weight: 600;
    letter-spacing: 0.01rem;
}

.pinfo {
    display: flex;
    flex-direction: column;
    padding: 0.14rem 0.18rem 0.18rem;
}

.pmodel {
    overflow: hidden;
    font-size: 0.25rem;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.pmeta {
    margin-top: 0.06rem;
    overflow: hidden;
    color: var(--txt-3);
    font-size: 0.18rem;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.pprice {
    margin-top: 0.1rem;
    color: var(--accent-soft);
    font-size: 0.24rem;
    font-weight: 600;
}

.list-foot {
    padding: 0.2rem 0 0.6rem;
    color: #333941;
    font-size: 0.18rem;
    text-align: center;
}

/* ---------- 产品详情（viewer） ---------- */
.vpage {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    padding-top: 0.88rem;
}

.fav {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 0.56rem;
    height: 0.56rem;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    cursor: pointer;
}

.fav-star {
    color: var(--txt-3);
    font-size: 0.26rem;
}

.fav-on .fav-star {
    color: var(--accent);
}

.vtabs {
    display: flex;
    flex: none;
    margin: 0.08rem 0.32rem 0;
    padding: 0.06rem;
    border-radius: 0.14rem;
    background: #10131a;
}

.vtab {
    flex: 1;
    height: 0.62rem;
    border-radius: 0.1rem;
    color: var(--txt-3);
    font-size: 0.23rem;
    line-height: 0.62rem;
    text-align: center;
    cursor: pointer;
}

.vtab-on {
    background: #1b1f27;
    color: #ffffff;
    font-weight: 600;
}

.vscroll {
    flex: 1;
}

.vstage {
    position: relative;
    height: 7rem;
    margin-top: 0.2rem;
    background: #ffffff;
    overflow: hidden;
}

.vstage-swiper {
    height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
}

.vstage-swiper::-webkit-scrollbar {
    display: none;
}

.vstage-slide {
    flex: none;
    width: 100%;
    height: 100%;
    scroll-snap-align: center;
    cursor: zoom-in;
}

.vstage-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.frame-badge {
    position: absolute;
    top: 0.2rem;
    right: 0.32rem;
    padding: 0.06rem 0.14rem;
    border-radius: 999px;
    background: rgba(14, 20, 30, 0.06);
    color: #4b5563;
    font-size: 0.18rem;
}

.gal-dots {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0.3rem;
    display: flex;
    justify-content: center;
    align-items: center;
}

.gal-dot {
    width: 0.1rem;
    height: 0.1rem;
    margin: 0 0.05rem;
    border-radius: 50%;
    background: rgba(14, 20, 30, 0.16);
    transition: width 0.2s, background 0.2s;
}

.gal-dot-on {
    width: 0.26rem;
    border-radius: 999px;
    background: #ff7a1a;
}

.stage-shop {
    position: absolute;
    right: 0.28rem;
    bottom: 0.24rem;
    display: flex;
    align-items: center;
    padding: 0.12rem 0.24rem;
    border-radius: 999px;
    background: rgba(255, 122, 26, 0.94);
    color: #1a0d02;
    font-size: 0.21rem;
    font-weight: 600;
    cursor: pointer;
}

.notice {
    margin: 0.04rem 0.32rem 0;
    padding: 0.22rem 0.24rem;
    border: 1px solid var(--line);
    border-radius: 0.16rem;
    background: #0c0f14;
}

.notice-t {
    color: var(--txt-2);
    font-size: 0.22rem;
    font-weight: 600;
}

.notice-d {
    display: block;
    margin-top: 0.08rem;
    color: var(--txt-4);
    font-size: 0.19rem;
    line-height: 1.6;
}

.light-box {
    margin-top: 0.2rem;
    background: #05060a;
}

.bulb {
    width: 0.56rem;
    height: 0.56rem;
    margin: 0 auto 0.18rem;
    border-radius: 50%;
    background: radial-gradient(circle, #ffd9b0 0%, #ff7a1a 48%, rgba(255, 122, 26, 0) 72%);
    opacity: 0.5;
}

.light-swiper {
    height: 6.2rem;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
}

.light-swiper::-webkit-scrollbar {
    display: none;
}

.light-slide {
    flex: none;
    width: 100%;
    height: 100%;
    scroll-snap-align: center;
}

.light-media {
    width: 100%;
    height: 6.2rem;
    object-fit: cover;
}

.light-bar {
    display: flex;
    align-items: center;
    padding: 0.12rem 0.32rem 0.16rem;
    background: #0a0c11;
}

.light-idx {
    color: #f5f7fa;
    font-size: 0.22rem;
    font-weight: 600;
}

.light-kind {
    margin-left: 0.1rem;
    padding: 0.02rem 0.12rem;
    border-radius: 999px;
    background: rgba(255, 122, 26, 0.16);
    color: #ffb27a;
    font-size: 0.18rem;
}

.light-hint {
    margin-left: auto;
    color: #6f7783;
    font-size: 0.19rem;
}

.block {
    padding: 0.28rem 0.32rem 0;
}

.block-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.16rem;
}

.block-title {
    font-size: 0.24rem;
    font-weight: 600;
}

.block-note {
    color: var(--txt-3);
    font-size: 0.19rem;
}

.vprice {
    display: flex;
    align-items: baseline;
    margin-top: 0.16rem;
}

.vprice-n {

        transform: translate(-50%, 0);
    }
}

/* ---------- 宽屏预览（桌面 / 内置预览面板）：按 375px 手机宽度居中渲染 ----------
   H5 用 rem 复刻小程序 rpx，屏宽越大会整体等比放大；桌面预览时锁定手机基准，
   否则版式会撑爆、看起来「没法预览」。手机上不触发此段，保持原生全屏体验。 */
@media (min-width: 600px) {
    html {
        font-size: 50px;
    }

    body {
        max-width: 375px;
        margin: 0 auto;
        box-shadow: 0 0 0.6rem rgba(0, 0, 0, 0.6);
    }

    .nav,
    .tabbar,
    .bar,
    .mask,
    .sheet,
    .toast {
        left: 50%;
        right: auto;
        width: 100%;
        max-width: 375px;
        transform: translateX(-50%);
    }

    .mask,
    .sheet {
        top: 0;
        bottom: 0;
    }

    .lightbox {
        left: 50%;
        right: auto;
        width: 100%;
        max-width: 375px;
        transform: translateX(-50%);
    }

    .sheet {
        animation-name: sheet-up-wide;
    }
}

@keyframes sheet-up-wide {
    from {
        transform: translate(-50%, 60%);
        opacity: 0.4;
    }

    to {
        transform: translate(-50%, 0);
        opacity: 1;
    }
}

<script>
// 本地存储：收藏 / 浏览历史（与小程序 utils/store.js 行为一致）
(function () {
    var KEY_FAV = 'lumintop.favs';
    var KEY_HIS = 'lumintop.history';

    function read(key) {
        try {
            var v = JSON.parse(localStorage.getItem(key) || '[]');
            return Array.isArray(v) ? v : [];
        } catch (e) {
            return [];
        }
    }

    function write(key, list) {
        try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) { /* 隐私模式忽略 */ }
    }

    var store = {
        favs: function () { return read(KEY_FAV); },
        history: function () { return read(KEY_HIS); },
        isFavorite: function (id) { return read(KEY_FAV).indexOf(id) >= 0; },
        toggleFavorite: function (id) {
            var list = read(KEY_FAV);
            var i = list.indexOf(id);
            if (i >= 0) list.splice(i, 1); else list.unshift(id);
            write(KEY_FAV, list);
            return i < 0;
        },
        addHistory: function (id) {
            if (!id) return;
            var list = read(KEY_HIS).filter(function (v) { return v !== id; });
            list.unshift(id);
            if (list.length > 50) list.length = 50;
            write(KEY_HIS, list);
        },
        clearHistory: function () { write(KEY_HIS, []); },
    };

    window.lumintopStore = store;
})();

</script>
<script>
// 数据模型层：与小程序 data/model.js + data/variants.js + utils/media.js 同构
// 页面只消费这里产出的结构；云端数据到达时 applyRemote() 重建目录并通知页面刷新
(function () {
    var CLOUD = window.LUMINTOP_CLOUD || {};

    /* ---------- 媒体路径映射（utils/media.js 的 H5 版） ---------- */
    var PLACEHOLDER = './assets/placeholder.jpg';

    function mediaUrl(ref) {
        var s = String(ref || '');
        // 已经是完整 URL / 本地相对路径的，原样返回
        if (/^(https?:|\.\/|\/)/.test(s) && !/^\/assets\//.test(s)) return s || PLACEHOLDER;
        var m = s.match(/^\/assets\/(products|lights)\/(.+)$/);
        if (!m) return s || PLACEHOLDER;
        // mediaBase 独立生效：云端开通后填云存储桶，本地预览版填本地服务地址均可
        if (CLOUD.mediaBase) {
            return CLOUD.mediaBase.replace(/\/?$/, '/') + m[1] + '/' + m[2];
        }
        return './media/' + m[1] + '/' + m[2];
    }

    function mapProduct(p) {
        if (!p) return p;
        var q = {};
        for (var k in p) q[k] = p[k];
        if (q.cover) q.cover = mediaUrl(q.cover);
        if (Array.isArray(q.gallery)) q.gallery = q.gallery.map(mediaUrl);
        if (q.lightScene) q.lightScene = mediaUrl(q.lightScene);
        if (Array.isArray(q.lightScenes)) q.lightScenes = q.lightScenes.map(mediaUrl);
        if (Array.isArray(q.lightMedia)) {
            q.lightMedia = q.lightMedia.map(function (m) {
                if (!m || !m.src) return m;
                var out = {};
                for (var k in m) out[k] = m[k];
                out.src = mediaUrl(m.src);
                if (m.poster) out.poster = mediaUrl(m.poster);
                return out;
            });
        }
        if (Array.isArray(q.colors)) {
            q.colors = q.colors.map(function (c) {
                return c && c.img ? Object.assign({}, c, { img: mediaUrl(c.img) }) : c;
            });
        }
        return q;
    }

    /* ---------- 颜色 / 材质 / 光照素材（variants.js） ---------- */
    var COLORS = {
        ti: [
            { name: '钛灰', hex: '#8E949E' },
            { name: '哑黑', hex: '#1A1D22' },
            { name: '沙色', hex: '#C9B18A' },
        ],
        edc: [
            { name: '哑黑', hex: '#1A1D22' },
            { name: '原色银', hex: '#BFC4CC' },
            { name: '午夜蓝', hex: '#2A3446' },
        ],
        tactic: [
            { name: '战术黑', hex: '#181B20' },
            { name: '军绿', hex: '#4A5142' },
            { name: '沙棕', hex: '#8A6A44' },
        ],
        long: [
            { name: '哑黑', hex: '#14171C' },
            { name: '石墨灰', hex: '#565C66' },
        ],
        camp: [
            { name: '哑黑', hex: '#1A1D22' },
            { name: '暖橙', hex: '#D9691F' },
            { name: '米白', hex: '#E2E0D8' },
        ],
        rainbow: [
            { name: '钛彩', hex: '#7A6FA8' },
            { name: '钛灰', hex: '#8E949E' },
            { name: '哑黑', hex: '#1A1D22' },
            { name: '铜色', hex: '#A9682F' },
        ],
    };

    var MATERIALS = ['铝合金', '不锈钢', '钛合金', 'HA III 硬质氧化'];

    var GROUPS = [
        { test: /^(EDC|FW|D\d)/i, colors: 'edc', mat: [0, 3] },
        { test: /^(THOR|GT|T90|PK90)/i, colors: 'long', mat: [0, 2] },
        { test: /^(MACH|TIGER|BLACK)/i, colors: 'tactic', mat: [0, 1] },
        { test: /^(W\d|F0\d|POWER|THANOS)/i, colors: 'camp', mat: [0, 3] },
        { test: /^RAINBOW/i, colors: 'rainbow', mat: [2, 0] },
    ];

    var DEFAULT_GROUP = { colors: 'ti', mat: [0, 1] };

    var OVERRIDES = {
        'p55-rainbow': { colors: 'rainbow', mat: [2, 0] },
        'p56-thor-5': { colors: 'tactic', mat: [0, 2] },
        'p26-gt-nano-5-0': { colors: 'ti', mat: [2, 0] },
    };

    function pickGroup(model) {
        for (var i = 0; i < GROUPS.length; i += 1) {
            if (GROUPS[i].test.test(model || '')) return GROUPS[i];
        }
        return DEFAULT_GROUP;
    }

    function variantsFor(product) {
        if (product.colors && product.colors.length) {
            var g = OVERRIDES[product.id] || pickGroup(product.model);
            return {
                colors: product.colors,
                materials: (product.materials && product.materials.length)
                    ? product.materials
                    : g.mat.map(function (i) { return MATERIALS[i]; }),
            };
        }
        var gg = OVERRIDES[product.id] || pickGroup(product.model);
        // 以后台为准：后台没配置配色的产品，前台不显示颜色选项（不再按型号猜预设色）
        // 材质仍按型号默认组兜底，保持既有展示
        return {
            colors: [],
            materials: gg.mat.map(function (i) { return MATERIALS[i]; }),
        };
    }

    var VIDEO_RE = /\.(mp4|mov|m4v|webm)(\?|$)/i;

    function lightsFor(product) {
        if (product && Array.isArray(product.lightMedia) && product.lightMedia.length) {
            return product.lightMedia.map(function (m) {
                var src = String((m && m.src) || '');
                if (!src) return null;
                var type = m.type === 'video' || m.type === 'image'
                    ? m.type
                    : (VIDEO_RE.test(src) ? 'video' : 'image');
                var item = { type: type, src: src };
                if (type === 'video' && m.poster) item.poster = m.poster;
                return item;
            }).filter(Boolean);
        }
        if (product && Array.isArray(product.lightScenes) && product.lightScenes.length) {
            return product.lightScenes.map(function (src) {
                return { type: VIDEO_RE.test(src) ? 'video' : 'image', src: src };
            });
        }
        if (product && product.lightScene) {
            return [{ type: VIDEO_RE.test(product.lightScene) ? 'video' : 'image', src: product.lightScene }];
        }
        return [];
    }

    /* ---------- 展示模型（model.js） ---------- */
    var SPEC_ORDER = ['光源', '功率', '光强', '电池', '防水', '防跌落', '尺寸', '净重'];

    function fmtNum(n) {
        if (!n) return '';
        if (!Number.isInteger(Number(n))) return String(n);
        return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function fmtRun(h) {
        if (!h) return '—';
        if (h >= 24) {
            var d = h / 24;
            return (d >= 10 ? Math.round(d) : Math.round(d * 10) / 10) + ' 天';
        }
        return (h >= 10 ? Math.round(h) : Math.round(h * 10) / 10) + ' h';
    }

    function fmtPrice(p) {
        if (!p) return '询价';
        return '¥' + fmtNum(p);
    }

    function pretty(s) {
        return String(s == null ? '' : s).replace(/\*/g, '×').trim();
    }

    function waterProof(spec) {
        var m = String(spec || '').replace(/[\s-]/g, '').match(/IP[X0-9]{1,2}/i);
        return m ? m[0].toUpperCase() : '—';
    }

    function buildMetrics(p) {
        return [
            { key: 'lum', label: '最高亮度', value: p.lumMax ? fmtNum(p.lumMax) : '—', unit: p.lumMax ? 'lm' : '' },
            { key: 'throw', label: '最远射程', value: p.throwMax ? fmtNum(p.throwMax) : '—', unit: p.throwMax ? 'm' : '' },
            { key: 'run', label: '最大续航', value: p.runMax ? fmtRun(p.runMax) : '—', unit: '' },
            { key: 'ip', label: '防水等级', value: waterProof(p.specs['防水']), unit: '' },
        ];
    }

    function buildSpecs(p) {
        var list = [];
        SPEC_ORDER.forEach(function (k) {
            if (p.specs[k]) list.push({ k: k, v: pretty(p.specs[k]) });
        });
        return list;
    }

    function buildFullSpecs(p) {
        return [
            { k: '光源', v: pretty(p.specs['光源']) || '—' },
            { k: '功率', v: pretty(p.specs['功率']) || '—' },
            { k: '光强', v: pretty(p.specs['光强']).replace(/\d{4,}/, function (n) { return fmtNum(Number(n)); }) || '—' },
            { k: '最高亮度', v: p.lumMax ? fmtNum(p.lumMax) + ' lm' : '—' },
            { k: '最远射程', v: p.throwMax ? fmtNum(p.throwMax) + ' m' : '—' },
            { k: '最大续航', v: p.runMax ? fmtRun(p.runMax) : '—' },
            { k: '档位数', v: p.gears.length ? p.gears.length + ' 档' : '—' },
            { k: '电池', v: pretty(p.specs['电池']) || '—' },
            { k: '防水等级', v: pretty(p.specs['防水']) || '—' },
            { k: '防跌落', v: pretty(p.specs['防跌落']) || '—' },
            { k: '尺寸', v: pretty(p.specs['尺寸']) || '—' },
            { k: '净重', v: pretty(p.specs['净重']) || '—' },
        ];
    }

    // 档位续航：带单位文本原样展示；纯数字按小时折算
    function fmtGearRun(h) {
        if (!h) return '—';
        if (typeof h === 'string') {
            var s = h.trim();
            if (!s) return '—';
            if (!/^-?\d+(?:\.\d+)?$/.test(s)) return s;
            h = Number(s);
        }
        if (!Number.isFinite(h)) return '—';
        if (h < 48) return (Number.isInteger(h) ? h : Math.round(h * 10) / 10) + ' h';
        return (h >= 240 ? Math.round(h / 24) : Math.round((h / 24) * 10) / 10) + ' 天';
    }

    function buildGears(p) {
        return p.gears.map(function (g) {
            return {
                name: g.name,
                lum: g.lum ? fmtNum(g.lum) : '—',
                run: g.runtime ? fmtGearRun(g.runtime) : '—',
                thr: g.throw ? fmtNum(g.throw) : '—',
            };
        });
    }

    // 配色支持独立定价：颜色对象带 price 字段时，选中该配色显示对应价格；
    // 未配置 price 的配色沿用产品默认价
    function buildOptions(colors) {
        return (colors || []).map(function (c) {
            return {
                name: c.name,
                hex: c.hex,
                img: c.img,
                label: c.name,
                price: c.price || null,
                priceText: c.price ? fmtPrice(c.price) : null,
            };
        });
    }

    function enrich(p) {
        var v = variantsFor(p);
        var cover = p.cover || PLACEHOLDER;
        var gears = buildGears(p);
        var lights = lightsFor(p);
        var shops = (Array.isArray(p.shops) ? p.shops : []).filter(function (s) { return s && s.url; })
            .map(function (s) { return { name: s.name || '官方店', url: s.url }; });
        var gearReady = gears.filter(function (g) { return g.lum !== '—'; }).length >= 2;
        return {
            id: p.id,
            model: p.model,
            subtitle: p.subtitle || '',
            category: p.category || '通用',
            cover: cover,
            hasPhoto: !!p.cover,
            price: p.price,
            priceText: fmtPrice(p.price),
            releaseAt: p.releaseAt,
            colors: v.colors,
            materials: v.materials,
            options: buildOptions(v.colors),
            gallery: (function () {
                var g = (Array.isArray(p.gallery) ? p.gallery : []).filter(Boolean).map(mediaUrl);
                return g.length ? g : [cover];
            })(),
            lights: lights,
            lightCount: lights.length,
            shopCount: shops.length,
            shops: shops,
            shopLabel: (shops[0] && shops[0].name) || '官方店',
            hasShop: shops.length > 0,
            metrics: buildMetrics(p),
            specs: buildSpecs(p),
            fullSpecs: buildFullSpecs(p),
            gears: gears,
            gearReady: gearReady,
            lumMax: p.lumMax,
            throwMax: p.throwMax,
            runMax: p.runMax,
        };
    }

    /* ---------- 目录构建 + 变更通知 ---------- */
    var listeners = [];

    function onChange(fn) {
        listeners.push(fn);
        return function () {
            var i = listeners.indexOf(fn);
            if (i >= 0) listeners.splice(i, 1);
        };
    }

    function notify() {
        listeners.slice().forEach(function (fn) {
            try { fn(); } catch (e) { /* 单页异常不影响其他页面 */ }
        });
    }

    var catalog = [];
    var byId = {};
    var lastRaw = [];

    var FILTER_ALIAS = {
        EDC: 'EDC 便携',
        战术户外: '战术户外',
        远射: '远射',
        多功能: '多功能',
        搜救: '搜救',
        通用: '通用',
    };

    var CATEGORIES = ['全部', 'EDC 便携', '远射', '战术户外', '多功能', '搜救', '头灯营地', '通用'];

    function categoryOf(p) {
        if (p.category && p.category !== '通用' && FILTER_ALIAS[p.category]) return FILTER_ALIAS[p.category];
        var m = (p.model || '').toUpperCase();
        if (/^(EDC|FW|D\d|PICO)/.test(m)) return 'EDC 便携';
        if (/^(THOR|GT|T90|PK90|L4)/.test(m)) return '远射';
        if (/^(W\d|F0|POWER|THANOS|AURORA)/.test(m)) return '头灯营地';
        if (/^(MACH|TIGER|BLACK|AK|B01)/.test(m)) return '战术户外';
        return '通用';
    }

    function rebuildCatalog(rawList) {
        lastRaw = rawList || [];
        var sorted = (rawList || []).slice().sort(function (a, b) {
            if (a.sortIndex != null && b.sortIndex != null) return a.sortIndex - b.sortIndex;
            if (a.sortIndex != null) return -1;
            if (b.sortIndex != null) return 1;
            return String(b.releaseAt || '').localeCompare(String(a.releaseAt || ''));
        });
        var items = sorted.map(function (p, i) {
            var item = enrich(mapProduct(p));
            item.sortIndex = i;
            item.filter = categoryOf(p);
            item.isNew = i < 3;
            return item;
        });
        catalog.length = 0;
        items.forEach(function (item) { catalog.push(item); });
        Object.keys(byId).forEach(function (k) { delete byId[k]; });
        catalog.forEach(function (p) { byId[p.id] = p; });
    }

    function applyRemote(rows) {
        if (!Array.isArray(rows) || !rows.length) return false;
        rebuildCatalog(rows);
        notify();
        return true;
    }

    function query(keyword, category) {
        var kw = String(keyword || '').trim().toLowerCase();
        return catalog.filter(function (p) {
            if (category && category !== '全部' && p.filter !== category) return false;
            if (!kw) return true;
            var hay = (p.model + ' ' + p.subtitle + ' ' + p.filter).toLowerCase();
            return hay.indexOf(kw) >= 0;
        });
    }

    // 本地打包数据先构建（云端数据到达后由 applyRemote 覆盖）
    rebuildCatalog(window.LUMINTOP_PRODUCTS || []);

    window.lumintopModel = {
        catalog: catalog,
        byId: byId,
        CATEGORIES: CATEGORIES,
        query: query,
        fmtNum: fmtNum,
        fmtRun: fmtRun,
        applyRemote: applyRemote,
        onChange: onChange,
        mediaUrl: mediaUrl,
        PLACEHOLDER: PLACEHOLDER,
    };
})();

</script>
<script>
// 云端数据同步：云服务开通并填好 cloud-config 后自动拉取 products 表（公开只读）
// 表结构见项目 cloud/seed/schema.sql：slug 唯一键 + sort_index + data(JSONB 完整档案)
// 数据到达后走 model.applyRemote() 重建目录，页面自动刷新 —— 与小程序 utils/cloud.js 同构
(function () {
    var CLOUD = window.LUMINTOP_CLOUD || {};

    function loadSdk(cb) {
        if (window.WorkBuddyCloud && window.WorkBuddyCloud.createWorkBuddyCloud) return cb();
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js';
        s.onload = cb;
        s.onerror = function () { console.warn('[cloud] SDK 加载失败，继续使用本地数据'); };
        document.head.appendChild(s);
    }

    function sync() {
        if (!CLOUD.enabled || !CLOUD.endpoint || !CLOUD.publishableKey) return;
        loadSdk(function () {
            try {
                var cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
                    endpoint: CLOUD.endpoint,
                    publishableKey: CLOUD.publishableKey,
                });
                cloud.database
                    .from('products')
                    .select('slug, sort_index, data')
                    .order('sort_index', { ascending: true })
                    .then(function (res) {
                        if (res.error) {
                            console.warn('[cloud] 拉取失败：', res.error.message || res.error);
                            return;
                        }
                        var rows = (res.data || []).map(function (r) {
                            var p = Object.assign({}, r.data || {});
                            if (r.slug) p.id = p.id || r.slug;
                            p.sortIndex = r.sort_index;
                            return p;
                        });
                        var ok = window.lumintopModel.applyRemote(rows);
                        if (ok) console.log('[cloud] 已同步云端产品数据 v1，共 ' + rows.length + ' 款');
                    });
            } catch (e) {
                console.warn('[cloud] 客户端初始化失败：', e && e.message);
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', sync);
    } else {
        sync();
    }
})();

</script>
<script>
// 雷明兔产品画册 H5 —— 路由 + 视图渲染
// 视图与小程序页面一一对应：deck=pages/index、library=pages/library、
// viewer=pages/viewer、profile=pages/profile、poster=pages/poster
(function () {
    var appEl = document.getElementById('app');
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightbox-img');
    var store = window.lumintopStore;
    var model = window.lumintopModel;
    var CLOUD = window.LUMINTOP_CLOUD || {};

    /* ---------- 工具 ---------- */
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    var toastTimer = null;
    function toast(msg) {
        var el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, 1600);
    }

    function openLightbox(src) {
        lightboxImg.src = src;
        lightbox.classList.add('show');
    }

    lightbox.addEventListener('click', function () {
        lightbox.classList.remove('show');
        lightboxImg.setAttribute('src', '');
    });

    // 图片加载失败兜底：预览版绝对地址取不到时退回同目录相对路径，再失败用占位图（绝不裂图）
    function imgFallback(e) {
        var img = e.target || e.srcElement;
        // 灯箱的 img 初始 src 为空，不参与兜底，否则会误显示占位图
        if (!img || img.id === 'lightbox-img' || img.dataset.fbk) return;
        img.dataset.fbk = '1';
        var src = img.getAttribute('src') || '';
        var rel = src.replace(/^https?:\/\/127\.0\.0\.1:8377\//, './');
        img.src = rel !== src ? rel : './assets/placeholder.jpg';
    }

    document.addEventListener('error', imgFallback, true);

    /* ---------- TabBar（画册 / 产品库 / 我的） ---------- */
    var TABS = [
        { key: 'deck', text: '画册', icon: './assets/tabbar/book.png', iconOn: './assets/tabbar/book-on.png' },
        { key: 'library', text: '产品', icon: './assets/tabbar/grid.png', iconOn: './assets/tabbar/grid-on.png' },
        { key: 'profile', text: '我的', icon: './assets/tabbar/user.png', iconOn: './assets/tabbar/user-on.png' },
    ];

    function tabbarHtml(active) {
        return '<div class="tabbar">' + TABS.map(function (t) {
            var on = t.key === active;
            return '<div class="tabbar-item' + (on ? ' on' : '') + '" data-tab="' + t.key + '">' +
                '<img src="' + (on ? t.iconOn : t.icon) + '" alt="">' +
                '<span>' + t.text + '</span></div>';
        }).join('') + '</div>';
    }

    appEl.addEventListener('click', function (e) {
        var tab = e.target.closest && e.target.closest('[data-tab]');
        if (tab && tab.classList.contains('tabbar-item')) {
            location.hash = '#/' + tab.dataset.tab;
        }
    });

    /* ---------- 画册首页（deck，竖向整页滑动） ---------- */
    var deckColorState = {};   // id -> 选中的配色下标
    var deckScroll = 0;

    function buildGal(p, ci) {
        var opt = p.options && p.options[ci];
        var head = (opt && opt.img) || p.cover;
        var out = [];
        if (head) out.push(head);
        (p.gallery && p.gallery.length ? p.gallery : []).slice(0, 8).forEach(function (v) {
            if (v && out.indexOf(v) < 0) out.push(v);
        });
        return out.length ? out : [p.cover];
    }

    function renderDeck() {
        var slides = model.catalog.map(function (p) {
            var ci = deckColorState[p.id] || 0;
            var sel = p.options[ci] || {};
            return {
                p: p,
                ci: ci,
                activeImg: (sel.img) || p.cover,
                activeLabel: sel.label || (p.colors[0] && p.colors[0].name) || '',
                // 选中配色配置了独立价格则随色切换，否则显示产品默认价
                activePrice: sel.priceText || p.priceText,
                priceChanged: !!sel.priceText && sel.priceText !== p.priceText,
            };
        });

        appEl.innerHTML =
            '<div class="page deck">' +
            '<div class="deck-nav"><div class="nav-inner">' +
            '<div class="brand"><span class="brand-en">LUMINTOP</span><span class="brand-cn">雷明兔 · 产品画册</span></div>' +
            '<div class="nav-count" id="go-library"><span>' + model.catalog.length + ' 款</span><span class="ico-search"><span class="ico-search-line"></span></span></div>' +
            '</div></div>' +
            '<div class="deck-swiper" id="deck-swiper">' +
            slides.map(function (s, si) {
                var p = s.p;
                return '<div class="deck-slide"><div class="card">' +
                    '<div class="stage" data-open="' + esc(p.id) + '">' +
                    '<img class="stage-img" src="' + esc(s.activeImg) + '" alt="">' +
                    '<span class="stage-tag">' + esc(s.activeLabel) + '</span>' +
                    '<span class="stage-cta' + (p.hasShop ? ' stage-cta-shop' : '') + '" data-cta="' + esc(p.id) + '">' +
                    (p.hasShop ? '去' + esc(p.shopLabel) + '看商品 ›' : '查看产品图集 ›') + '</span>' +
                    '</div>' +
                    '<div class="body">' +
                    '<div class="head"><div class="head-l"><div class="head-row"><span class="model">' + esc(p.model) + '</span>' +
                    (p.isNew ? '<span class="badge-new">NEW</span>' : '') +
                    '</div><span class="sub">' + esc(p.subtitle) + '</span></div>' +
                    '<div class="head-r"><span class="price">' + esc(s.activePrice) + '</span>' +
                    '<span class="price-note">' + (s.priceChanged ? '该配色价格' : '指导价') + '</span></div></div>' +
                    '<div class="opts"><div class="opts-inner">' +
                    p.options.map(function (c, i) {
                        return '<span class="opt' + (i === s.ci ? ' opt-on' : '') + '" data-color="' + esc(p.id) + '|' + i + '">' +
                            '<span class="dot" style="background:' + esc(c.hex) + '"></span>' + esc(c.label) + '</span>';
                    }).join('') +
                    '</div></div>' +
                    '<div class="grid">' +
                    p.metrics.map(function (v) {
                        return '<div class="cell"><div class="cell-v"><span class="cell-num">' + esc(v.value) + '</span>' +
                            (v.unit ? '<span class="cell-unit">' + esc(v.unit) + '</span>' : '') +
                            '</div><span class="cell-label">' + esc(v.label) + '</span></div>';
                    }).join('') +
                    '</div>' +
                    '<div class="entry" data-light="' + esc(p.id) + '"><span class="entry-ico"></span>' +
                    '<span class="entry-t">光照实拍' + (p.lightCount ? ' · ' + p.lightCount + ' 个素材' : ' · 待上传') + '</span>' +
                    '<span class="arrow"></span></div>' +
                    '<div class="spec-head"><span class="spec-title">技术参数</span><span class="spec-note">ANSI / NEMA FL1</span></div>' +
                    p.specs.slice(0, 3).map(function (row) {
                        return '<div class="spec-row"><span class="spec-k">' + esc(row.k) + '</span><span class="spec-v">' + esc(row.v) + '</span></div>';
                    }).join('') +
                    (!p.specs.length ? '<div class="spec-row"><span class="spec-k">—</span><span class="spec-v">参数整理中</span></div>' : '') +
                    '<div class="more" data-drawer="' + esc(p.id) + '"><span class="more-t">查看完整参数表 · 共 ' + p.fullSpecs.length + ' 项</span><span class="arrow"></span></div>' +
                    (si === 0 ? '<div class="hint">上滑 · 查看下一款产品</div>' : '<div style="flex:1"></div>') +
                    '</div></div></div>';
            }).join('') +
            '</div>' + tabbarHtml('deck') + '</div>';

        var swiper = document.getElementById('deck-swiper');
        swiper.scrollTop = deckScroll;
        swiper.addEventListener('scroll', function () { deckScroll = swiper.scrollTop; });

        document.getElementById('go-library').onclick = function () { location.hash = '#/library'; };

        appEl.querySelectorAll('[data-color]').forEach(function (el) {
            el.onclick = function () {
                var parts = el.dataset.color.split('|');
                var id = parts[0], ci = Number(parts[1]);
                deckColorState[id] = ci;
                deckScroll = swiper.scrollTop;
                renderDeck();
            };
        });
        appEl.querySelectorAll('[data-open]').forEach(function (el) {
            el.onclick = function (e) {
                if (e.target.closest('[data-cta]')) return;
                location.hash = '#/viewer/' + el.dataset.open;
            };
        });
        appEl.querySelectorAll('[data-cta]').forEach(function (el) {
            el.onclick = function (e) {
                e.stopPropagation();
                var p = model.byId[el.dataset.cta];
                if (p && p.hasShop) { toast('商品链接：' + p.shops[0].url); return; }
                location.hash = '#/viewer/' + el.dataset.cta;
            };
        });
        appEl.querySelectorAll('[data-light]').forEach(function (el) {
            el.onclick = function () { location.hash = '#/viewer/' + el.dataset.light + '?tab=light'; };
        });
        appEl.querySelectorAll('[data-drawer]').forEach(function (el) {
            el.onclick = function () { location.hash = '#/viewer/' + el.dataset.drawer + '?drawer=1'; };
        });
    }

    /* ---------- 产品库 ---------- */
    var libState = { kw: '', cat: '全部' };

    function renderLibrary() {
        var list = model.query(libState.kw, libState.cat);
        var total = model.catalog.length;

        appEl.innerHTML =
            '<div class="page lib-body" style="padding-top:0.88rem">' +
            '<div class="nav"><div class="nav-inner"><span class="nav-title">产品库</span><span class="nav-sub">共 ' + total + ' 款</span></div></div>' +
            '<div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:0.08rem 0.32rem 0">' +
            '<div class="search"><span class="ico-search"><span class="ico-search-line"></span></span>' +
            '<input class="search-input" id="lib-kw" value="' + esc(libState.kw) + '" placeholder="搜索型号 / 系列 / 流明">' +
            (libState.kw ? '<span class="search-clear" id="lib-clear">✕</span>' : '') + '</div>' +
            '<div class="cats">' +
            model.CATEGORIES.map(function (c) {
                return '<span class="cat' + (c === libState.cat ? ' cat-on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</span>';
            }).join('') +
            '</div>' +
            '<div class="meta-row"><span class="meta-count">' + list.length + ' 款结果</span><span class="meta-sort">按上架时间 · 新品置顶</span></div>' +
            '<div class="lib-list">' +

    /* ---------- 产品详情（viewer） ---------- */
    function renderViewer(id, opts) {

        var p = model.byId[id] || model.catalog[0];
        if (!p) { location.hash = '#/deck'; return; }
        var tab = opts.tab || 'stage';
        var fav = store.isFavorite(p.id);
        var gal = buildGal(p, opts.ci || 0);
        var lights = p.lights;
        var selOpt = p.options[opts.ci || 0] || {};
        var vPrice = selOpt.priceText || p.priceText;
        var vPriceChanged = !!selOpt.priceText && selOpt.priceText !== p.priceText;

        var bodyHtml;
        if (tab === 'stage') {
            bodyHtml =
                '<div class="vstage" id="gal-wrap">' +
                '<div class="vstage-swiper" id="gal">' +
                gal.map(function (src) {
                    return '<div class="vstage-slide" data-preview="' + esc(src) + '"><img src="' + esc(src) + '" alt=""></div>';
                }).join('') +
                '</div>' +
                (gal.length > 1 ? '<span class="frame-badge" id="gal-badge">1 / ' + gal.length + '</span>' : '') +
                (gal.length > 1 ? '<div class="gal-dots">' + gal.map(function (_, i) {
                    return '<span class="gal-dot' + (i === 0 ? ' gal-dot-on' : '') + '"></span>';
                }).join('') + '</div>' : '') +

                (!p.hasShop ? '<div class="notice"><span class="notice-t">还没配置平台商品链接</span>' +
                    '<span class="notice-d">后台「官方商城链接」填上京东 / 天猫等商品页地址后，这里会出现直达按钮。</span></div>' : '');
        } else {
            bodyHtml =
                '<div class="light-box">' +
                (!lights.length
                    ? '<div class="empty"><div class="bulb"></div><span class="empty-title">光照实拍素材待上传</span>' +
                      '<span class="empty-text">后台「光照实拍素材」支持上传多张实拍图片与多段视频，按上传顺序在这里左右滑动查看。</span></div>'
                    : '<div class="light-swiper" id="light-swiper">' +
                      lights.map(function (m) {
                          if (m.type === 'video') {
                              return '<div class="light-slide"><video class="light-media" src="' + esc(m.src) + '"' +
                                  (m.poster ? ' poster="' + esc(m.poster) + '"' : '') +
                                  ' controls playsinline muted loop></video></div>';
                          }
                          return '<div class="light-slide"><img class="light-media" src="' + esc(m.src) + '" alt=""></div>';
                      }).join('') +
                      '</div>' +
                      '<div class="light-bar"><span class="light-idx" id="light-idx">1 / ' + lights.length + '</span>' +
                      '<span class="light-kind" id="light-kind">' + (lights[0].type === 'video' ? '视频' : '图片') + '</span>' +
                      (lights.length > 1 ? '<span class="light-hint">左右滑动查看全部素材</span>' : '') + '</div>') +
                '</div>';
        }

        var gearsHtml;
        if (p.gearReady) {
            gearsHtml = '<div class="gear-head"><span class="g-name">档位</span><span class="g-cell">亮度</span><span class="g-cell">续航</span></div>' +
                p.gears.map(function (g) {
                    return '<div class="gear-row"><span class="g-name">' + esc(g.name) + '</span>' +
                        '<span class="g-cell">' + esc(g.lum) + '</span><span class="g-cell">' + esc(g.run) + '</span></div>';
                }).join('') +
                '<div class="block-tip">画册里以「50S+ 3H 20M」这类降档写法标注的档位不回填数值，待后台补录。</div>';

        } else {

            '<div class="vscroll">' + bodyHtml +

            '<div class="opts"><div class="opts-inner">' +

        if (galEl) {
            galEl.addEventListener('scroll', function () {
                var i = Math.round(galEl.scrollLeft / galEl.clientWidth);
                var badge = document.getElementById('gal-badge');
                if (badge) badge.textContent = (i + 1) + ' / ' + gal.length;

                dots.forEach(function (d, di) { d.classList.toggle('gal-dot-on', di === i); });

        if (lightEl && lights.length) {
            lightEl.addEventListener('scroll', function () {
                var i = Math.round(lightEl.scrollLeft / lightEl.clientWidth);
                document.getElementById('light-idx').textContent = (i + 1) + ' / ' + lights.length;

        return '<div class="mask" id="sheet-mask"></div>' +
            '<div class="sheet"><div class="sheet-top"><div class="sheet-handle"></div>' +
            '<div class="sheet-head"><span class="sheet-title">完整技术参数</span>' +
            '<span class="sheet-sub">' + esc(p.model) + ' · ' + p.fullSpecs.length + ' 项</span>' +
            '<span class="sheet-close" id="sheet-close">✕</span></div></div>' +
            '<div class="sheet-body"><div class="spec-grid">' +
            p.fullSpecs.map(function (s) {
                return '<div class="spec-item"><span class="spec-k">' + esc(s.k) + '</span><span class="spec-v">' + esc(s.v) + '</span></div>';
            }).join('') +
            '</div><div class="sheet-label">分档参数</div>' +

                ? '<div class="gear-head"><span class="g-name">档位</span><span class="g-cell">亮度</span><span class="g-cell">续航</span></div>' +
                  p.gears.map(function (g) {
                      return '<div class="gear-row"><span class="g-name">' + esc(g.name) + '</span>' +
                          '<span class="g-cell">' + esc(g.lum) + '</span><span class="g-cell">' + esc(g.run) + '</span></div>';
                  }).join('')
                : (p.gears.length
                    ? '<div class="gear-list">' + p.gears.map(function (g) {
                        return '<span class="gear-chip">' + esc(g.name) + '</span>';
                    }).join('') + '</div>'
                    : '<div class="sheet-note">该页画册未提供分档表，档位数据待后台补录。</div>')) +
            '<div class="sheet-note">亮度单位为 lm；续航按 ANSI 标准自极亮档开始计时。</div></div>' +
            '<div class="sheet-actions"><span class="sheet-btn" id="sheet-poster">生成分享海报</span></div></div>';

    function bindDrawer(p, opts) {
        document.getElementById('sheet-mask').onclick = function () { renderViewer(p.id, Object.assign({}, opts, { drawer: false })); };
        document.getElementById('sheet-close').onclick = function () { renderViewer(p.id, Object.assign({}, opts, { drawer: false })); };
        document.getElementById('sheet-poster').onclick = function () { location.hash = '#/poster/' + p.id; };
    }

    function toggleFav() {
        var m = location.hash.match(/viewer\/([^?]+)/);
        if (!m) return;
        var on = store.toggleFavorite(m[1]);
        toast(on ? '已收藏' : '已取消收藏');
        store.addHistory(m[1]);
    }

    function shareProduct(p) {
        var url = location.origin + location.pathname + '#/viewer/' + p.id;
        var text = p.model + ' · ' + p.metrics[0].value + ' 流明 / 射程 ' + p.metrics[1].value + ' 米';
        if (navigator.share) {
            navigator.share({ title: '雷明兔 · 产品画册', text: text, url: url }).catch(function () { /* 用户取消 */ });
        } else {
            copyText(url);
            toast('链接已复制，去粘贴分享吧');
        }
    }

    function copyText(t) {
        if (navigator.clipboard) { navigator.clipboard.writeText(t).catch(function () {}); return; }
        var ta = document.createElement('textarea');
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) { /* noop */ }
        ta.remove();
    }

    /* ---------- 分享海报（pages/poster 的 H5 版） ---------- */
    function renderPoster(id) {
        var p = model.byId[id] || model.catalog[0];
        if (!p) { location.hash = '#/deck'; return; }

        appEl.innerHTML =
            '<div class="page poster-page" style="padding-top:0.88rem">' +
            '<div class="nav"><div class="nav-inner"><span class="nav-back" id="p-back"><span class="nav-back-icon"></span></span>' +
            '<span class="nav-title">分享海报</span></div></div>' +
            '<div class="poster-canvas-wrap"><canvas id="poster" width="1280" height="2000"></canvas></div>' +
            '<div class="poster-actions"><button class="poster-btn" id="poster-save">保存海报</button>' +
            '<button class="poster-btn ghost" id="poster-back">返回</button></div></div>';

        document.getElementById('p-back').onclick = function () { history.back(); };
        document.getElementById('poster-back').onclick = function () { history.back(); };
        document.getElementById('poster-save').onclick = function () {
            var a = document.createElement('a');
            a.download = (p.model || 'lumintop') + '-poster.jpg';
            a.href = document.getElementById('poster').toDataURL('image/jpeg', 0.92);
            a.click();
            toast('海报已生成，浏览器已开始下载');
        };

        var canvas = document.getElementById('poster');
        var ctx = canvas.getContext('2d');
        var W = 640, H = 1000;
        ctx.save();
        ctx.scale(2, 2);

        var accentSoft = '#FF9A4D';
        ctx.fillStyle = '#08090B';
        ctx.fillRect(0, 0, W, H);
        var glow = ctx.createRadialGradient(W / 2, 260, 20, W / 2, 300, 420);
        glow.addColorStop(0, 'rgba(28,34,48,1)');
        glow.addColorStop(1, 'rgba(8,9,11,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, 660);

        var img = new Image();
        img.onload = function () {
            var pad = 24;
            var iw = W - pad * 2;
            var cardH = iw * (img.height / img.width);
            var ih = 40 + cardH;
            ctx.save();
            roundRect(ctx, pad, 40, iw, cardH, 14);
            ctx.clip();
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(pad, 40, iw, cardH);
            ctx.drawImage(img, pad, 40, iw, cardH);
            ctx.restore();

            text(ctx, p.model, 40, ih + 40, 40, '#FFFFFF', true);
            text(ctx, p.subtitle, 40, ih + 78, 18, '#7D8694');

            var top = ih + 130;
            p.metrics.forEach(function (m, i) {
                var cx = 40 + i * ((W - 80) / 4);
                text(ctx, m.value + (m.unit ? ' ' + m.unit : ''), cx, top, 24, '#F5F7FA', true);
                text(ctx, m.label, cx, top + 26, 13, '#5C6472');
            });

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(40, top + 60);
            ctx.lineTo(W - 40, top + 60);
            ctx.stroke();

            text(ctx, p.priceText, 40, top + 106, 30, accentSoft, true);
            text(ctx, '官方指导价', 40, top + 138, 13, '#5C6472');
            text(ctx, 'LUMINTOP 雷明兔', 40, H - 70, 16, '#A7AFBC', true);
            text(ctx, '打开链接查看完整参数与光照实拍 · 雷明兔产品画册', 40, H - 46, 12, '#5C6472');
            ctx.restore();
        };
        img.onerror = function () { toast('产品图加载失败'); };
        img.src = p.cover;

        function roundRect(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r);
            c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r);
            c.arcTo(x, y, x + w, y, r);
            c.closePath();
        }

        function text(c, str, x, y, size, color, bold) {
            c.fillStyle = color;
            c.font = (bold ? '600 ' : '400 ') + size + 'px -apple-system, "PingFang SC", sans-serif';
            c.fillText(str || '', x, y);
        }
    }

    /* ---------- 路由 ---------- */
    function route() {
        var hash = location.hash.replace(/^#\/?/, '');
        var parts = hash.split('?');
        var segs = parts[0].split('/').filter(Boolean);
        var q = {};
        (parts[1] || '').split('&').forEach(function (kv) {
            if (!kv) return;
            var p = kv.split('=');
            q[p[0]] = p[1] || '';
        });

        if (segs[0] === 'library') return renderLibrary();
        if (segs[0] === 'profile') return renderProfile(q.mode);
        if (segs[0] === 'viewer' && segs[1]) {
            store.addHistory(decodeURIComponent(segs[1]));
            return renderViewer(decodeURIComponent(segs[1]), {
                tab: q.tab === 'light' ? 'light' : 'stage',
                drawer: q.drawer === '1',
            });
        }
        if (segs[0] === 'poster' && segs[1]) return renderPoster(decodeURIComponent(segs[1]));
        renderDeck();
    }

    window.addEventListener('hashchange', route);

    // 云端数据到达后刷新当前视图（保持 hash 不变）
    model.onChange(function () {
        if (location.hash.indexOf('viewer') < 0) route();
    });

    route();
})();

</script>
</body>
</html>
